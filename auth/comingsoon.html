<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../auth/coming.css">
</head>

<body>

<div class="container">

      <div><span id="seconds">00</span><p>Sec</p></div>

    <div class="subscribe">
      <input type="email" placeholder="Enter your email">
      <button>Notify Me</button>
    </div>

  </div>

</div>

<script src="../auth/coming.js"></script>
