<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Fromagerie â€” Sign In</title>
  <meta name="description" content="Sign in to your Maison Fromagerie account to explore artisan cheeses and curated charcuterie boards.">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <!-- Styles -->
  <link rel="stylesheet" href="../auth/signup.css">
</head>

<body>

  <!-- Page Controls â€” RTL + Theme toggle -->
  <div class="page-controls">
    <button id="rtlToggle" class="rtl-btn" aria-label="Toggle RTL">RTL</button>
    <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">&#x1F319;</button>
  </div>

  <div class="container">
    <div class="card">

      <!-- Company brand logo linking to home -->
      <a href="../index.html" class="card-brand">
        <span class="card-brand__icon">&#x2B21;</span>
        <span class="card-brand__text">Maison <em>Fromagerie</em></span>
      </a>

      <form id="loginForm" class="form active">
        <h2>Welcome Back</h2>

        <div class="input-group">
          <input type="email" id="loginEmail" required>
          <label for="loginEmail">Email</label>
        </div>

        <div class="input-group">
          <input type="password" id="loginPassword" required>
          <label for="loginPassword">Password</label>
        </div>

        <button type="submit" class="primary-btn">Login</button>

        <div class="divider">OR</div>

        <button type="button" class="social google">Google</button>
        <button type="button" class="social apple">Apple</button>

        <p class="switch">
          Don't have an account? <a href="signup.html" class="switch-link">Sign up</a>
        </p>
      </form>

    </div>
  </div>

  <script src="../auth/login.js"></script>
</body>

</html>
